<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeVerse 🌸</title><link rel="stylesheet" href="style.css"></head><body><div class="tree">🌸</div><header><div class="eyebrow">🌸 ANIMEVERSE</div><h1>Discover your next anime.</h1><p>Live anime discovery with a Japanese spring theme.</p><div class="searchbar"><input id="search" placeholder="Search anime..."><button id="searchBtn">Search</button><button id="startQuiz">🧠 Take the Quiz</button></div></header><main><section class="panel"><h2>Explore</h2><div id="chips" class="chips"></div><div class="filters"><select id="sort"><option value="popularity">Popular</option><option value="score">Highest Rated</option><option value="newest">Newest</option><option value="trending">Trending</option></select><select id="status"><option value="">Any Status</option><option value="current">Currently Airing</option><option value="finished">Finished</option></select></div></section><section id="result" class="panel" hidden><h2>Your Anime Taste</h2><p id="resultTaste"></p><div id="resultCard"></div></section><section class="panel"><div id="grid" class="grid"></div><div class="pagination"><button id="prev">← Previous</button><span id="pageText">Page 1</span><button id="next">Next →</button></div></section></main><div id="quizModal" class="modal" hidden><div class="modalbox"><button id="closeQuiz" class="close">×</button><div id="qCount"></div><div class="progress"><div id="progressBar"></div></div><h2 id="qText"></h2><div id="answers"></div></div></div><script src="app.js"></script></body></html>
